name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # अगर आपकी मुख्य ब्रांच का नाम master है, तो यहाँ master लिखें

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # अगर आप Vite यूज़ कर रहे हैं तो dist, अगर CRA (Create React App) है तो build लिखें

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
